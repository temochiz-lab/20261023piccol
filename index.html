<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Piccol — 画像を切り抜く</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="." aria-label="Piccol ホーム"><span class="brand-mark">p</span><span>piccol</span></a>
      <span class="build-label">build+20261123</span>
    </header>

    <section class="workspace" aria-label="画像の切り抜き">
      <aside class="sidebar">
        <div class="intro">
          <p class="eyebrow">IMAGE STUDIO</p>
          <h1>好きなところを、<br>ちょうどよく。</h1>
          <p class="intro-copy">画像を読み込んで、切り抜きたい範囲を選びます。</p>
        </div>

        <label class="upload-button" for="file-input"><span class="upload-icon">＋</span><span>画像を選ぶ</span><span class="shortcut">Ctrl O</span></label>
        <input id="file-input" type="file" accept="image/*" hidden>
        <p class="drop-hint">画像をここへドラッグ、または<br><kbd>Ctrl</kbd> <span class="key-plus">+</span> <kbd>V</kbd> で貼り付け</p>

        <div class="control-group">
          <div class="section-label"><span>切り抜きの形</span><span class="step-number">01</span></div>
          <div class="shape-toggle" role="group" aria-label="切り抜きの形">
            <button class="shape-button active" data-shape="rect" aria-pressed="true"><span class="shape-icon rect-icon"></span>四角</button>
            <button class="shape-button" data-shape="circle" aria-pressed="false"><span class="shape-icon circle-icon"></span>円</button>
          </div>
        </div>

        <div class="control-group zoom-group">
          <div class="section-label"><span>画像の表示サイズ</span><span class="step-number">02</span></div>
          <div class="zoom-readout"><span>拡大・縮小</span><strong id="zoom-value">100%</strong></div>
          <input id="zoom-slider" type="range" min="10" max="300" value="100" aria-label="画像の拡大縮小">
          <div class="zoom-actions"><button id="zoom-out" aria-label="縮小">−</button><button id="fit-button">全体を表示</button><button id="zoom-in" aria-label="拡大">＋</button></div>
        </div>

        <div class="sidebar-bottom"><span class="privacy-dot"></span>画像はこのブラウザ内で処理されます</div>
      </aside>

      <section class="editor" aria-label="画像編集エリア">
        <div class="editor-toolbar">
          <div class="toolbar-left"><span class="live-dot"></span><span id="image-status">画像を読み込んでください</span></div>
          <span class="toolbar-tip" id="selection-tip">ドラッグして範囲を選択</span>
        </div>
        <div class="canvas-viewport" id="drop-zone">
          <div class="empty-state" id="empty-state">
            <div class="empty-art" aria-hidden="true"><span class="art-sun"></span><span class="art-hill hill-one"></span><span class="art-hill hill-two"></span><span class="art-frame"></span></div>
            <h2>画像をここにドロップ</h2>
            <p>または <button id="empty-paste">クリップボードから貼り付け</button></p>
            <span class="file-types">JPG · PNG · WEBP など</span>
          </div>
          <canvas id="image-canvas" aria-label="切り抜く範囲を選択する画像"></canvas>
          <div class="drop-overlay" id="drop-overlay"><span>ここに画像をドロップ</span></div>
        </div>
        <div class="editor-footer"><span id="dimensions-label">範囲を選ぶとサイズが表示されます</span><span>PNGで保存</span></div>
      </section>
    </section>

    <footer class="actionbar">
      <div class="selection-summary"><span class="summary-icon">⌗</span><span id="selection-summary">切り抜き範囲を選択してください</span></div>
      <div class="action-buttons"><button id="back-button" class="secondary-button" hidden>範囲を選び直す</button><button id="place-button" class="secondary-button" disabled>切り抜きを配置</button><button id="copy-button" class="secondary-button" disabled><span class="copy-icon">▢</span>コピー</button><button id="download-button" class="primary-button" disabled>PNGを書き出す<span class="arrow">↗</span></button></div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
